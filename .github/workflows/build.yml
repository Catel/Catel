name: Build

on:
  push:
    branches:
      - develop
      - master
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the component(s)
        required: false
        type: boolean
        default: false
  #pull_request:
    # Note: don't run on PR for security reasons
  
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest # Required for some (WPF) projects
  
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        id: checkout
        with:
          fetch-depth: 0
          
      - name: Setup .NET Core
        id: setup-dotnet
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'    
    
      - name: Cake Action
        id: cake-action
        uses: cake-build/cake-action@d218f1133bb74a1df0b08c89cfd8fc100c09e1a0 #v3.0.1
        with:
          target: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy && 'BuildAndDeploy' || 'BuildAndTest' }}
          arguments: |
            IsCiBuild: ${{ github.event_name == 'push' }}