name: Build

on:
  push:
    branches:
      - develop
      - master
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the component(s)
        required: false
        type: boolean
        default: true
  #pull_request:
    # Note: don't run on PR for security reasons
  
permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: windows-latest # Required for some (WPF) projects
    env:
      AzureCodeSignCertificateName: ''
      AzureCodeSignClientId: ''
      AzureCodeSignClientSecret: ''
      AzureCodeSignTenantId: ''
      AzureCodeSignVaultName: ''
      CodeSignCertificateSubjectName: ''
      NuGetRepositoryUrl: ''
      NuGetUser: ''
      SonarOrganization: ''
      SonarUrl: ''
      SonarToken: ''
  
    steps:
      - name: Enable Git long paths (global)
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          fetch-depth: 0
          
      - name: Setup .NET Core
        id: setup-dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'    

      - name: Azure login (for Key Vault access)
        id: azure-login
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Retrieve build-and-test secrets from Key Vault
        id: key-vault-build-secrets
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy != true) }}
        shell: pwsh
        env:
          AZURE_KEYVAULT_NAME: ${{ vars.AZURE_KEYVAULT_NAME || secrets.AZURE_KEYVAULT_NAME }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_KEYVAULT_NAME)) {
            throw "AZURE_KEYVAULT_NAME is not configured"
          }

          if ([string]::IsNullOrWhiteSpace($env:REPOSITORY_OWNER)) {
            throw "REPOSITORY_OWNER is not available"
          }

          Write-Output "::add-mask::$env:AZURE_KEYVAULT_NAME"

          function Get-SecretValueFromCandidates {
            param(
              [Parameter(Mandatory = $true)]
              [string] $VariableName
            )

            $candidateNames = @(
              "$($env:REPOSITORY_OWNER)-Public-$VariableName"
              "$($env:REPOSITORY_OWNER)-$VariableName"
              "$VariableName"
            )

            foreach ($candidateName in $candidateNames) {
              $secretValue = az keyvault secret show --only-show-errors --vault-name $env:AZURE_KEYVAULT_NAME --name $candidateName --query value -o tsv 2>$null

              if ($LASTEXITCODE -eq 0) {
                return [string]$secretValue
              }
            }

            throw "Key Vault secret for '$VariableName' was not found. Tried: $($candidateNames -join ', ')"
          }

          $secretVariables = @(
            @{ VariableName = 'SonarOrganization'; MaskValue = $false }
            @{ VariableName = 'SonarUrl'; MaskValue = $false }
            @{ VariableName = 'SonarToken'; MaskValue = $true }
          )

          foreach ($secretVariable in $secretVariables) {
            $envName = $secretVariable.VariableName
            $secretValue = Get-SecretValueFromCandidates -VariableName $envName

            if ($secretVariable.MaskValue -and -not [string]::IsNullOrEmpty($secretValue)) {
              Write-Output "::add-mask::$secretValue"
            }

            Add-Content -Path $env:GITHUB_ENV -Value "$envName=$secretValue"
          }

      - name: Retrieve build-and-deploy secrets from Key Vault
        id: key-vault-deploy-secrets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
        shell: pwsh
        env:
          AZURE_KEYVAULT_NAME: ${{ vars.AZURE_KEYVAULT_NAME || secrets.AZURE_KEYVAULT_NAME }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_KEYVAULT_NAME)) {
            throw "AZURE_KEYVAULT_NAME is not configured"
          }

          if ([string]::IsNullOrWhiteSpace($env:REPOSITORY_OWNER)) {
            throw "REPOSITORY_OWNER is not available"
          }

          Write-Output "::add-mask::$env:AZURE_KEYVAULT_NAME"

          function Get-SecretValueFromCandidates {
            param(
              [Parameter(Mandatory = $true)]
              [string] $VariableName
            )

            $candidateNames = @(
              "$($env:REPOSITORY_OWNER)-Public-$VariableName"
              "$($env:REPOSITORY_OWNER)-$VariableName"
              "$VariableName"
            )

            foreach ($candidateName in $candidateNames) {
              $secretValue = az keyvault secret show --only-show-errors --vault-name $env:AZURE_KEYVAULT_NAME --name $candidateName --query value -o tsv 2>$null

              if ($LASTEXITCODE -eq 0) {
                return [string]$secretValue
              }
            }

            throw "Key Vault secret for '$VariableName' was not found. Tried: $($candidateNames -join ', ')"
          }

          $secretVariables = @(
            @{ VariableName = 'AzureCodeSignCertificateName'; MaskValue = $true }
            @{ VariableName = 'AzureCodeSignTenantId'; MaskValue = $true }
            @{ VariableName = 'AzureCodeSignClientId'; MaskValue = $true }
            @{ VariableName = 'AzureCodeSignClientSecret'; MaskValue = $true }
            @{ VariableName = 'CodeSignCertificateSubjectName'; MaskValue = $false }
            @{ VariableName = 'NuGetRepositoryUrl'; MaskValue = $false }
            @{ VariableName = 'NuGetUser'; MaskValue = $true }
            @{ VariableName = 'SonarOrganization'; MaskValue = $false }
            @{ VariableName = 'SonarUrl'; MaskValue = $false }
            @{ VariableName = 'SonarToken'; MaskValue = $true }
          )

          foreach ($secretVariable in $secretVariables) {
            $envName = $secretVariable.VariableName
            $secretValue = Get-SecretValueFromCandidates -VariableName $envName

            if ($secretVariable.MaskValue -and -not [string]::IsNullOrEmpty($secretValue)) {
              Write-Output "::add-mask::$secretValue"
            }

            Add-Content -Path $env:GITHUB_ENV -Value "$envName=$secretValue"
          }

          Add-Content -Path $env:GITHUB_ENV -Value "AzureCodeSignVaultName=$env:AZURE_KEYVAULT_NAME"
    
      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        id: nuget-login
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ env.NuGetUser }}
    
      # Build & test
      - name: Build and test via Cake
        id: cake-action-build-test
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy != true) }}
        uses: cake-build/cake-action@d218f1133bb74a1df0b08c89cfd8fc100c09e1a0 #v3.0.1
        with:
          target: 'BuildAndTest'
          arguments: |
            IsCiBuild: "true"
            SonarOrganization: "${{ env.SonarOrganization }}"
            SonarUrl: "${{ env.SonarUrl }}"
            SonarProject: "${{ github.repository_owner }}_${{ github.event.repository.name }}"
            SonarToken: "${{ env.SonarToken }}"

      # Build & deploy
      - name: Build and deploy via Cake
        id: cake-action-build-deploy
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
        uses: cake-build/cake-action@d218f1133bb74a1df0b08c89cfd8fc100c09e1a0 #v3.0.1
        with:
          target: 'BuildAndDeploy'
          arguments: |
            AzureCodeSignCertificateName: "${{ env.AzureCodeSignCertificateName }}"
            AzureCodeSignClientId: "${{ env.AzureCodeSignClientId }}"
            AzureCodeSignClientSecret: "${{ env.AzureCodeSignClientSecret }}"
            AzureCodeSignTenantId: "${{ env.AzureCodeSignTenantId }}"
            AzureCodeSignVaultName: "${{ env.AzureCodeSignVaultName }}"
            CodeSignCertificateSubjectName: "${{ env.CodeSignCertificateSubjectName }}"
            IsCiBuild: "false"
            NuGetRepositoryUrl: "${{ env.NuGetRepositoryUrl }}"
            NuGetRepositoryApiKey: "${{steps.nuget-login.outputs.NUGET_API_KEY}}"
            SonarOrganization: "${{ env.SonarOrganization }}"
            SonarUrl: "${{ env.SonarUrl }}"
            SonarProject: "${{ github.repository_owner }}_${{ github.event.repository.name }}"
            SonarToken: "${{ env.SonarToken }}"
